<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tute Cabrero</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
</head>
<body>
    <h1>Tute Cabrero</h1>
    <div id="setup">
        <input type="text" id="nombre" placeholder="Tu nombre">
        <input type="text" id="sala" placeholder="Código de sala">
        <button onclick="unirse()">Unirse</button>
    </div>

    <div id="game" style="display:none;">
        <h2>Sala: <span id="nombre-sala"></span></h2>
        <h3>Jugadores:</h3>
        <ul id="lista-jugadores"></ul>
        <button onclick="comenzar()">Repartir Cartas</button>
        
        <h3>Tus Cartas:</h3>
        <div id="mis-cartas" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
        <h3 id="info-triunfo"></h3>
    </div>

    <script>
        const socket = io();
        let miSala = "";

        const diseñoPalos = {
            oros: { icono: "🪙", clase: "oros" },
            copas: { icono: "🍷", clase: "copas" },
            espadas: { icono: "⚔️", clase: "espadas" },
            bastos: { icono: "🪵", clase: "bastos" }
        };

        function unirse() {
            const name = document.getElementById("nombre").value;
            miSala = document.getElementById("sala").value;
            if(!name || !miSala) return;

            console.log("Intentando unirse a la sala:", miSala, "como:", name);
            socket.emit("join_room", { room: miSala, name: name });
            document.getElementById("setup").style.display = "none";
            document.getElementById("game").style.display = "block";
            document.getElementById("nombre-sala").innerText = miSala.toUpperCase();
        }

        function comenzar() {
            socket.emit("start_game", { room: miSala });
        }

        // Evento que recibe la lista de jugadores
        socket.on("update_lobby", (data) => {
            console.log("¡Evento update_lobby recibido!", data);
            const elemento = document.getElementById("lista-jugadores");
            if (elemento && data.players) {
                elemento.innerText = data.players.join(" - ");
            }
        });

        function crearCartaHTML(numero, palo) {
            const diseño = diseñoPalos[palo];
            let div = document.createElement("div");
            div.className = `carta ${diseño.clase}`;
            
            let textoNum = numero;
            if(numero === 10) textoNum = "Sota";
            if(numero === 11) textoNum = "Cab";
            if(numero === 12) textoNum = "Rey";

            div.innerHTML = `
                <div style="text-align: left;">${textoNum}</div>
                <div class="centro">${diseño.icono}</div>
                <div style="text-align: right; transform: rotate(180deg);">${textoNum}</div>
            `;
            return div;
        }

        socket.on("game_started", (data) => {
            const contenedor = document.getElementById("mis-cartas");
            contenedor.innerHTML = "";
            data.hand.forEach(carta => {
                let divCarta = crearCartaHTML(carta.numero, carta.palo);
                contenedor.appendChild(divCarta);
            });
        });

        socket.on("info_partida", (data) => {
            const diseño = diseñoPalos[data.triunfo.palo];
            document.getElementById("info-triunfo").innerHTML = 
                `TRIUNFO: ${data.triunfo.numero} de ${diseño.icono}`;
        });
    </script>
